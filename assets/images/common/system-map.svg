<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Learning design system map</title>
  <desc id="desc">A connected path from expertise through decisions, practice and feedback to improvement.</desc>
  <rect width="760" height="520" rx="28" fill="#151b23"/>
  <path d="M104 114c75 0 78 74 153 74s78-74 153-74 78 74 153 74 78-74 93-74" fill="none" stroke="#2b3644" stroke-width="3"/>
  <path d="M104 344c75 0 78-74 153-74s78 74 153 74 78-74 153-74 78 74 93 74" fill="none" stroke="#2b3644" stroke-width="3"/>
  <g font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(104 114)"><circle r="50" fill="#1b2430" stroke="#7fdccb" stroke-width="3"/><text y="6" fill="#f5f2eb" font-size="18">Expertise</text></g>
    <g transform="translate(257 188)"><circle r="50" fill="#1b2430" stroke="#f2a65a" stroke-width="3"/><text y="6" fill="#f5f2eb" font-size="18">Decisions</text></g>
    <g transform="translate(410 114)"><circle r="50" fill="#1b2430" stroke="#7fdccb" stroke-width="3"/><text y="6" fill="#f5f2eb" font-size="18">Practice</text></g>
    <g transform="translate(563 188)"><circle r="50" fill="#1b2430" stroke="#f2a65a" stroke-width="3"/><text y="6" fill="#f5f2eb" font-size="18">Feedback</text></g>
    <g transform="translate(410 344)"><circle r="62" fill="#7fdccb"/><text y="-4" fill="#0b0f14" font-size="17">Improvement</text><text y="19" fill="#0b0f14" font-size="13">tested + revised</text></g>
  </g>
  <path d="M563 238C563 318 492 344 472 344" fill="none" stroke="#7fdccb" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7fdccb"/></marker></defs>
  <text x="104" y="466" fill="#8f9aa8" font-family="system-ui, sans-serif" font-size="15">The learner's task remains visible across the system.</text>
