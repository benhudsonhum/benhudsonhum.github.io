<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Learning design centred on the learner's task</title>
  <desc id="desc">Four connected stages—understand the work, design for practice, build for delivery, and test and revise—with evidence returning to the next round of inquiry.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7fdccb"/></marker>
  </defs>
  <rect width="760" height="520" rx="28" fill="#151b23"/>
  <text x="380" y="64" fill="#7fdccb" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="2" text-anchor="middle">THE LEARNER'S TASK STAYS VISIBLE</text>
  <path d="M92 220H668" fill="none" stroke="#7fdccb" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(110 220)">
      <circle r="62" fill="#1b2430" stroke="#7fdccb" stroke-width="3"/>
      <text y="-8" fill="#f5f2eb" font-size="17" font-weight="800">Understand</text><text y="15" fill="#f5f2eb" font-size="17" font-weight="800">the work</text>
    </g>
    <g transform="translate(290 220)">
      <circle r="62" fill="#1b2430" stroke="#f2a65a" stroke-width="3"/>
      <text y="-8" fill="#f5f2eb" font-size="17" font-weight="800">Design for</text><text y="15" fill="#f5f2eb" font-size="17" font-weight="800">practice</text>
    </g>
    <g transform="translate(470 220)">
      <circle r="62" fill="#1b2430" stroke="#7fdccb" stroke-width="3"/>
      <text y="-8" fill="#f5f2eb" font-size="17" font-weight="800">Build for</text><text y="15" fill="#f5f2eb" font-size="17" font-weight="800">delivery</text>
    </g>
    <g transform="translate(650 220)">
      <circle r="62" fill="#1b2430" stroke="#f2a65a" stroke-width="3"/>
      <text y="-8" fill="#f5f2eb" font-size="17" font-weight="800">Test and</text><text y="15" fill="#f5f2eb" font-size="17" font-weight="800">revise</text>
    </g>
  </g>
  <path d="M650 296v56c0 40-30 68-70 68H180c-40 0-70-28-70-68v-43" fill="none" stroke="#7fdccb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="380" y="390" fill="#f5f2eb" font-family="system-ui, sans-serif" font-size="18" font-weight="750" text-anchor="middle">Learner, instructor, stakeholder, technical and evaluation evidence</text>
  <text x="380" y="448" fill="#9fa9b6" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">Evidence returns to the work and guides the next round of revision.</text>
</svg>
