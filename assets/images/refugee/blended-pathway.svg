<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Blended sponsorship-learning pathway</title>
  <desc id="desc">The pathway connects a self-directed primer, facilitated interpretation, group planning, an applied task and a follow-up resource.</desc>
  <rect width="960" height="560" rx="24" fill="#151b23"/>
  <path d="M90 300C220 115 330 450 480 265S730 120 870 285" fill="none" stroke="#2b3644" stroke-width="18" stroke-linecap="round"/>
  <g font-family="system-ui" text-anchor="middle" font-weight="700">
    <g><circle cx="110" cy="275" r="58" fill="#1b2430" stroke="#7fdccb" stroke-width="3"/><circle cx="295" cy="295" r="58" fill="#1b2430" stroke="#f2a65a" stroke-width="3"/><circle cx="480" cy="265" r="58" fill="#1b2430" stroke="#7fdccb" stroke-width="3"/><circle cx="665" cy="210" r="58" fill="#1b2430" stroke="#f2a65a" stroke-width="3"/><circle cx="850" cy="285" r="58" fill="#1b2430" stroke="#7fdccb" stroke-width="3"/></g>
    <g fill="#f5f2eb" font-size="16"><text x="110" y="267">Self-directed</text><text x="110" y="289">primer</text><text x="295" y="287">Facilitated</text><text x="295" y="309">interpretation</text><text x="480" y="257">Group</text><text x="480" y="279">planning</text><text x="665" y="202">Applied</text><text x="665" y="224">task</text><text x="850" y="277">Follow-up</text><text x="850" y="299">resource</text></g>
  </g>
  <text x="480" y="475" text-anchor="middle" fill="#bac3ce" font-family="system-ui" font-size="18">Stable information prepares learners; facilitated time supports interpretation and application.</text>
</svg>
