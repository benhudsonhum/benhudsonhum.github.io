<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Three-week facilitator-development cycle</title>
  <desc id="desc">A three-week program for 20 youth peer educators moving through modelling, participatory rehearsal, participant-led practice, observation and feedback, and preparation for delivery.</desc>
  <rect width="960" height="560" rx="24" fill="#151b23"/>
  <text x="480" y="72" text-anchor="middle" fill="#f5f2eb" font-family="system-ui" font-size="28" font-weight="700">Three-week facilitator-development cycle</text>
  <text x="480" y="105" text-anchor="middle" fill="#bac3ce" font-family="system-ui" font-size="18">20 youth peer educators · preparation for delivery</text>
  <path d="M115 300h730" fill="none" stroke="#2b3644" stroke-width="14" stroke-linecap="round"/>
  <g font-family="system-ui" text-anchor="middle" font-weight="700">
    <g fill="#1b2430" stroke-width="3"><circle cx="130" cy="300" r="64" stroke="#7fdccb"/><circle cx="305" cy="300" r="64" stroke="#f2a65a"/><circle cx="480" cy="300" r="64" stroke="#7fdccb"/><circle cx="655" cy="300" r="64" stroke="#f2a65a"/><circle cx="830" cy="300" r="64" stroke="#7fdccb"/></g>
    <g fill="#f5f2eb" font-size="16"><text x="130" y="305">Modelling</text><text x="305" y="294">Participatory</text><text x="305" y="316">rehearsal</text><text x="480" y="294">Participant-led</text><text x="480" y="316">practice</text><text x="655" y="294">Observation</text><text x="655" y="316">+ feedback</text><text x="830" y="294">Prepare for</text><text x="830" y="316">delivery</text></g>
  </g>
  <g fill="none" stroke="#f5f2eb" stroke-width="3" marker-end="url(#arrow)"><path d="M194 300h45"/><path d="M369 300h45"/><path d="M544 300h45"/><path d="M719 300h45"/></g>
  <text x="480" y="470" text-anchor="middle" fill="#bac3ce" font-family="system-ui" font-size="18">Experience the methods, rehearse, receive feedback and prepare for independent delivery.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f5f2eb"/></marker></defs>
</svg>
