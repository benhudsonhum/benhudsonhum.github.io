<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare learning-system map</title>
  <desc id="desc">Clinical expertise becomes learning outcomes, criteria learning, guided practice, simulations, feedback, and evaluation-led revision.</desc>
  <rect width="960" height="560" rx="24" fill="#151b23"/>
  <g font-family="system-ui" text-anchor="middle">
    <g fill="#1b2430" stroke="#2b3644" stroke-width="2">
      <rect x="45" y="130" width="190" height="100" rx="14"/><rect x="270" y="130" width="190" height="100" rx="14"/><rect x="495" y="130" width="190" height="100" rx="14"/><rect x="720" y="130" width="190" height="100" rx="14"/>
      <rect x="270" y="330" width="190" height="100" rx="14"/><rect x="495" y="330" width="190" height="100" rx="14"/>
    </g>
    <g fill="#f5f2eb" font-size="20" font-weight="700"><text x="140" y="173">Clinical</text><text x="140" y="199">expertise</text><text x="365" y="173">Learning</text><text x="365" y="199">outcomes</text><text x="590" y="173">Criteria</text><text x="590" y="199">learning</text><text x="815" y="173">Guided</text><text x="815" y="199">practice</text><text x="365" y="373">Actor</text><text x="365" y="399">simulations</text><text x="590" y="373">Feedback +</text><text x="590" y="399">revision</text></g>
  </g>
  <g fill="none" stroke="#7fdccb" stroke-width="4" marker-end="url(#a)"><path d="M235 180h35"/><path d="M460 180h35"/><path d="M685 180h35"/><path d="M815 230v150H685"/><path d="M495 380h-35"/><path d="M365 330V260"/></g>
  <path d="M590 330c0-68-54-70-54-100" fill="none" stroke="#f2a65a" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#b)"/>
  <text x="480" y="500" text-anchor="middle" fill="#bac3ce" font-family="system-ui" font-size="18">One judgement task connects content, practice, implementation and evaluation.</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7fdccb"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f2a65a"/></marker></defs>
</svg>
